apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel-miiml
  namespace: zitadel
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: zitadel
      version: "9.26.0"
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system
  dependsOn:
    - name: cert-manager
      namespace: flux-system
    - name: zitadel-postgresql
      namespace: zitadel
  valuesFrom:
    - kind: Secret
      name: zitadel-secrets
      valuesKey: values.yaml

  values:
    fullnameOverride: "zitadel-miiml"
    zitadel:
      configmapConfig:
        # Break-glass admin path. The setup Job only writes /login-client/pat during
        # FirstInstance, which is skipped on an existing instance, so the login-client
        # Secret was never created and login v2 stayed down. With Features.LoginV2
        # active every OIDC authorize redirects to that dead login, meaning no one can
        # sign in to fix it by hand. A SystemAPIUser authenticates with a self-signed
        # JWT instead of the login UI, so it stays usable when the login path is broken.
        # Private key is held out-of-band; only the public key belongs here.
        SystemAPIUsers:
          - systemuser:
              KeyData: 
              Memberships:
                - MemberType: System
                  Roles:
                    - "SYSTEM_OWNER"
                    - "IAM_OWNER"
                    - "ORG_OWNER"
        ExternalDomain: zitadel.miiml.org
        ExternalPort: 443
        ExternalSecure: true
        TLS:
          Enabled: false
        Database:
          Postgres:
            Host: zitadel-postgresql
            Port: 5432
            Database: zitadel
            MaxOpenConns: 20
            MaxIdleConns: 10
            MaxConnLifetime: 30m
            MaxConnIdleTime: 5m
            User:
              Username: zitadel
              SSL:
                Mode: disable
            Admin:
              Username: postgres
              SSL:
                Mode: disable
    service:
      type: NodePort
      protocol: grpc
      appProtocol: kubernetes.io/h2c
    postgresql:
      enabled: false
