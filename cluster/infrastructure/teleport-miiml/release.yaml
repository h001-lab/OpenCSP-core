apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport-cluster
  namespace: teleport-miiml
spec:
  targetNamespace: teleport-miiml
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: teleport-cluster
      # TODO: 배포 전 최신 버전 확인 (https://goteleport.com/docs/changelog/)
      version: "18.7.6"
      sourceRef:
        kind: HelmRepository
        name: teleport
        namespace: flux-system
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  values:
    fullnameOverride: "teleport-cluster"
    clusterName: "teleport.miiml.org"
    proxyListenerMode: multiplex

    tls:
      existingSecretName: ""
      certManager:
        enabled: false # teleport 자체 서명 인증서 사용

    auth:
      teleportConfig:
        teleport:
          storage:
            type: dir
            path: /var/lib/teleport

    proxy:
      service:
        type: ClusterIP

    ingress:
      enabled: false

    operator:
      enabled: true
