apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport-kube-operator
  namespace: teleport
spec:
  interval: 1h
  chart:
    spec:
      chart: teleport-kube-operator
      version: "18.6.4"
      sourceRef:
        kind: HelmRepository
        name: teleport
        namespace: flux-system
  dependsOn:
    - name: teleport-cluster
  values:
    # in-cluster auth 서비스 주소 (3025: auth gRPC 포트)
    teleportAddress: "teleport-teleport-cluster-auth:3025"
    teleportClusterName: "teleport.avgmax.team"
    joinParams:
      method: kubernetes
      # 아래 tctl 명령으로 사전 생성해야 하는 ProvisionToken 이름
      tokenName: "teleport-operator"
