apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector-gw
  namespace: flux-system
spec:
  targetNamespace: otel-collector
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.158.1"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  values:
    image:
      repository: otel/opentelemetry-collector-k8s

    mode: deployment
    replicaCount: 1

    serviceAccount:
      create: true
      name: otel-collector-gw

    clusterRole:
      create: true
      name: otel-collector-gw
      rules:
        - apiGroups: [""]
          resources: [pods, nodes, nodes/metrics, namespaces, endpoints, services, events, resourcequotas, replicationcontrollers]
          verbs: [get, list, watch]
        - apiGroups: [apps]
          resources: [replicasets, deployments, daemonsets, statefulsets]
          verbs: [get, list, watch]
        - apiGroups: [batch]
          resources: [jobs, cronjobs]
          verbs: [get, list, watch]
        - apiGroups: [autoscaling]
          resources: [horizontalpodautoscalers]
          verbs: [get, list, watch]
        - nonResourceURLs: [/metrics, /metrics/cadvisor]
          verbs: [get]

    service:
      type: ClusterIP

    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      metrics:
        enabled: true
        containerPort: 8888
        servicePort: 8888
        protocol: TCP

    config:
      receivers:
        # 파드/앱이 직접 메트릭·로그·트레이스를 밀어넣는 수신 엔드포인트
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        # 클러스터 레벨 메트릭 (디플로이먼트/파드 상태, 노드 allocatable 등)
        k8s_cluster:
          collection_interval: 30s
          node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
          allocatable_types_to_report: [cpu, memory, pods, storage]

        # 클러스터 이벤트를 로그로 수집 (Warning 이벤트 포함)
        k8sobjects:
          objects:
            - name: events
              mode: watch

        # Cilium / Hubble 메트릭 스크래핑
        prometheus:
          config:
            scrape_configs:
              # Cilium agent 운영 메트릭 (DaemonSet, 포트 9962)
              - job_name: cilium-agent
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [kube-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                    regex: cilium
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: "$1:9962"
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node

              # Hubble 플로우 메트릭 (Cilium agent 파드, 포트 9965)
              - job_name: cilium-hubble
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [kube-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                    regex: cilium
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: "$1:9965"
                  - source_labels: [__meta_kubernetes_pod_node_name]
                    target_label: node

              # Cilium operator 메트릭 (포트 9963)
              - job_name: cilium-operator
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [kube-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_name]
                    regex: cilium-operator
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: "$1:9963"

              # Hubble relay 운영 메트릭 (포트 9966)
              - job_name: hubble-relay
                kubernetes_sd_configs:
                  - role: pod
                    namespaces:
                      names: [kube-system]
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                    regex: hubble-relay
                    action: keep
                  - source_labels: [__meta_kubernetes_pod_ip]
                    target_label: __address__
                    replacement: "$1:9966"

      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15

        # 파드 메타데이터를 속성으로 붙임 (namespace, pod, node, deployment 등)
        k8s_attributes:
          auth_type: serviceAccount
          passthrough: false
          extract:
            metadata:
              - k8s.pod.name
              - k8s.pod.uid
              - k8s.namespace.name
              - k8s.node.name
              - k8s.deployment.name
              - k8s.replicaset.name
              - k8s.statefulset.name
              - k8s.daemonset.name

        batch:
          timeout: 10s
          send_batch_size: 1000

      exporters:
        # ---------------------------------------------------------------
        # [현재] Grafana 백엔드 (192.168.11.44)
        # Prometheus OTLP: http://192.168.11.44:9090/api/v1/otlp/v1/metrics
        #   → Prometheus 실행 시 --enable-feature=otlp-write-receiver 필요
        # Loki OTLP:       http://192.168.11.44:3100/otlp
        # Tempo: 미구성 (traces 파이프라인 비활성화)
        # ---------------------------------------------------------------
        otlp_http/metrics:
          endpoint: http://192.168.11.44:9090/api/v1/otlp/v1/metrics
          tls:
            insecure: true

        otlp_http/logs:
          endpoint: http://192.168.11.44:3100/otlp
          tls:
            insecure: true

        # ---------------------------------------------------------------
        # [나중에] Kafka로 전환 시 아래 주석 해제 후
        # pipelines.[signal].exporters 를 kafka/xxx 로 교체
        # ---------------------------------------------------------------
        # kafka/metrics:
        #   brokers: ["kafka.kafka.svc:9092"]
        #   topic: otel-metrics
        #   encoding: otlp_proto
        # kafka/logs:
        #   brokers: ["kafka.kafka.svc:9092"]
        #   topic: otel-logs
        #   encoding: otlp_proto
        # kafka/traces:
        #   brokers: ["kafka.kafka.svc:9092"]
        #   topic: otel-traces
        #   encoding: otlp_proto

        debug:
          verbosity: normal

      service:
        telemetry:
          logs:
            level: info
          metrics:
            address: 0.0.0.0:8888

        pipelines:
          metrics:
            receivers: [otlp, k8s_cluster, prometheus]
            processors: [memory_limiter, k8s_attributes, batch]
            exporters: [otlp_http/metrics]

          logs:
            receivers: [otlp, k8sobjects]
            processors: [memory_limiter, k8s_attributes, batch]
            exporters: [otlp_http/logs]

          # traces: Tempo 미구성 - 필요 시 otlp_http/traces 또는 kafka/traces 추가

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
