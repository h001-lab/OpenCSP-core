apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector-agent
  namespace: flux-system
spec:
  targetNamespace: otel-collector
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.158.1"
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
        namespace: flux-system
  values:
    image:
      repository: otel/opentelemetry-collector-k8s

    # 각 노드에 배포하여 노드 메트릭·파드 로그를 수집
    mode: daemonset

    serviceAccount:
      create: true
      name: otel-collector-agent

    clusterRole:
      create: true
      name: otel-collector-agent
      rules:
        - apiGroups: [""]
          resources: [pods, nodes, nodes/metrics, nodes/stats, nodes/proxy, namespaces, endpoints]
          verbs: [get, list, watch]
        - apiGroups: [apps]
          resources: [replicasets]
          verbs: [get, list, watch]
        - nonResourceURLs: [/metrics, /metrics/cadvisor]
          verbs: [get]

    # 노드 메트릭 수집을 위해 호스트 네트워크 및 볼륨 마운트 필요
    hostNetwork: false

    extraVolumes:
      - name: varlogpods
        hostPath:
          path: /var/log/pods
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers

    extraVolumeMounts:
      - name: varlogpods
        mountPath: /var/log/pods
        readOnly: true
      - name: varlibdockercontainers
        mountPath: /var/lib/docker/containers
        readOnly: true

    securityContext:
      runAsUser: 0  # 로그 파일 읽기 위해 root 필요
      runAsGroup: 0

    config:
      receivers:
        # 노드/파드 리소스 메트릭 (kubelet stats API 사용)
        kubeletstats:
          collection_interval: 30s
          auth_type: serviceAccount
          endpoint: "https://${env:K8S_NODE_NAME}:10250"
          insecure_skip_verify: true
          metric_groups: [node, pod, container, volume]
          extra_metadata_labels: [container.id]

        # 파드 컨테이너 로그 수집 (파일 기반)
        filelog:
          include:
            - /var/log/pods/*/*/*.log
          exclude:
            - /var/log/pods/otel-collector_*/*/*.log  # self 제외
          start_at: end
          include_file_path: true
          include_file_name: false
          operators:
            # 1단계: 컨테이너 런타임 wrapper 포맷 파싱
            - type: router
              id: get-format
              routes:
                - output: parser-docker
                  expr: 'body matches "^\\{"'
                - output: parser-crio
                  expr: 'body matches "^[^ Z]+ "'
              default: parser-containerd
            - type: json_parser
              id: parser-docker
              output: extract-k8s-meta
              timestamp:
                parse_from: attributes.time
                layout: "%Y-%m-%dT%H:%M:%S.%LZ"
            - type: regex_parser
              id: parser-crio
              regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
              output: extract-k8s-meta
              timestamp:
                parse_from: attributes.time
                layout_type: gotime
                layout: "2006-01-02T15:04:05.999999999Z07:00"
            - type: regex_parser
              id: parser-containerd
              regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
              output: extract-k8s-meta
              timestamp:
                parse_from: attributes.time
                layout: "%Y-%m-%dT%H:%M:%SZ"

            # 2단계: 파일 경로에서 k8s 메타데이터 추출
            # 경로 형식: /var/log/pods/<namespace>_<pod-name>_<uid>/<container>/<n>.log
            - type: regex_parser
              id: extract-k8s-meta
              regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<pod_uid>[^/]+)/(?P<container_name>[^/]+)/\d+\.log$'
              parse_from: attributes["log.file.path"]
              parse_to: attributes
              output: move-namespace
            - type: move
              id: move-namespace
              from: attributes.namespace
              to: attributes["k8s.namespace.name"]
              output: move-pod-name
            - type: move
              id: move-pod-name
              from: attributes.pod_name
              to: attributes["k8s.pod.name"]
              output: move-pod-uid
            - type: move
              id: move-pod-uid
              from: attributes.pod_uid
              to: attributes["k8s.pod.uid"]
              output: move-container-name
            - type: move
              id: move-container-name
              from: attributes.container_name
              to: attributes["k8s.container.name"]
              output: move-body

            # 3단계: 로그 내용을 body로 이동
            - type: move
              id: move-body
              from: attributes.log
              to: body
              output: try-parse-json

            # 4단계: body가 JSON이면 구조화 파싱 (app 레벨 structured log 지원)
            - type: json_parser
              id: try-parse-json
              if: 'body matches "^\\s*\\{"'
              parse_from: body
              parse_to: attributes

      processors:
        memory_limiter:
          check_interval: 1s
          limit_percentage: 75
          spike_limit_percentage: 15

        k8sattributes:
          auth_type: serviceAccount
          passthrough: false
          filter:
            node_from_env_var: K8S_NODE_NAME
          # filelog은 네트워크 연결이 없으므로 파일 경로에서 추출한 pod UID로 매핑
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
            - sources:
                - from: record_attribute
                  name: k8s.pod.uid
          extract:
            metadata:
              - k8s.pod.name
              - k8s.pod.uid
              - k8s.namespace.name
              - k8s.node.name
              - k8s.deployment.name
              - k8s.replicaset.name
              - k8s.statefulset.name
              - k8s.daemonset.name
              - k8s.container.name
            labels:
              - tag_name: app
                key: app
                from: pod
              - tag_name: app.kubernetes.io/name
                key: app.kubernetes.io/name
                from: pod

        batch:
          timeout: 10s
          send_batch_size: 1000

      exporters:
        # gateway로 포워딩
        otlp:
          endpoint: otel-collector-otel-collector-gw-opentelemetry-collector.otel-collector.svc.cluster.local:4317
          tls:
            insecure: true

      service:
        telemetry:
          logs:
            level: info

        pipelines:
          metrics:
            receivers: [kubeletstats]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlp]
          logs:
            receivers: [filelog]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlp]

    extraEnvs:
      - name: K8S_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    tolerations:
      - operator: "Exists"

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
