apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
  namespace: flux-system
spec:
  releaseName: tofu-controller
  interval: 30m
  chart:
    spec:
      chart: tofu-controller
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    reconciler:
      image:
        repository: ghcr.io/flux-iac/tf-runner
        # latest 금지(hardening-no-latest VAP)에 맞춰 버전 고정.
        # v0.16.4 는 현재 latest 가 가리키는 semver 태그다.
        tag: "v0.16.4"