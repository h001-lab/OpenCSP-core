# ── Pod Security Standards: RESTRICTED 를 ValidatingAdmissionPolicy 로 강제 ──
# runAsNonRoot / allowPrivilegeEscalation=false / drop ALL / seccompProfile / capability add 제한.
# 이 컴포넌트를 켜면(hardening/kustomization.yaml 에서 주석 해제) 전역 Deny 로 강제된다.
#   - baseline 바인딩은 kustomization.yaml 의 patch 로 [Warn,Audit] → [Deny] 로 오버라이드된다.
#   - restricted 바인딩(아래)도 baseline 과 동일한 전역 opt-out 범위로 Deny 한다.
# opt-out: 네임스페이스에 hardening.opencsp.io/restricted=ignore 라벨을 붙이면 제외된다.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: hardening-restricted
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: podRunAsNonRoot
      expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.runAsNonRoot) &&
        object.spec.securityContext.runAsNonRoot == true
    - name: podSeccomp
      expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost']
  validations:
    # runAsNonRoot (파드 또는 모든 컨테이너 단위로 충족)
    - expression: >-
        variables.podRunAsNonRoot ||
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) &&
          c.securityContext.runAsNonRoot == true)
      message: "모든 컨테이너는 runAsNonRoot: true 여야 합니다. (PSS restricted)"
      reason: Forbidden
    # allowPrivilegeEscalation: false
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      message: "모든 컨테이너는 allowPrivilegeEscalation: false 여야 합니다. (PSS restricted)"
      reason: Forbidden
    # capabilities: drop [ALL]
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(d, d == 'ALL'))
      message: "모든 컨테이너는 capabilities.drop: [ALL] 이어야 합니다. (PSS restricted)"
      reason: Forbidden
    # capability add 는 NET_BIND_SERVICE 만 허용
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          c.securityContext.capabilities.add.all(cap, cap == 'NET_BIND_SERVICE'))
      message: "restricted 에서는 NET_BIND_SERVICE 외 capability 추가가 금지됩니다. (PSS restricted)"
      reason: Forbidden
    # seccompProfile: RuntimeDefault | Localhost
    - expression: >-
        variables.podSeccomp ||
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.seccompProfile) &&
          c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'])
      message: "seccompProfile 은 RuntimeDefault 또는 Localhost 여야 합니다. (PSS restricted)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: hardening-restricted
spec:
  policyName: hardening-restricted
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        # 컨트롤 플레인 / 인프라 네임스페이스는 제외 (자체 privileged 워크로드 존재)
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-node-lease
            - kube-public
            - flux-system
            - security-scanning
        # 네임스페이스 단위 opt-out
        - key: hardening.opencsp.io/restricted
          operator: NotIn
          values: ["ignore"]
