apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  # Flux가 CRD를 직접 관리하도록 정책 추가
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: cilium
      version: "1.18.6"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    k8sServiceHost: "192.168.11.50"
    k8sServicePort: 6443
    kubeProxyReplacement: "true"

    nodePort:
      bindProtection: false

    k8s:
      requireIPv4PodCIDR: true

    k8sClientRateLimit:
      qps: 50
      burst: 100

    bpf:
      extraArgs:
        - "-Wno-macro-redefined"
      lbExternalClusterIP: true

    devices: "eth+"
    installIptablesRules: true

    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]

    gatewayAPI:
      enabled: true
      enableAppProtocol: true
      enableAlpn: true

    ingressController:
      enabled: true
      default: true
      loadbalancerMode: shared
      ingressStatusAddress: "192.168.11.50"
      service:
        type: NodePort
        nodePort: 30443
      proxyProtocol: false
    envoy:
      enabled: true
      
    installCRDs: true

    # Cilium agent 메트릭 엔드포인트 (포트 9962)
    prometheus:
      enabled: true
      port: 9962

    operator:
      replicas: 1
      prometheus:
        enabled: true
        port: 9963

    hubble:
      enabled: true
      relay:
        enabled: true
        prometheus:
          enabled: true
          port: 9966
      ui:
        enabled: true
      # Hubble 플로우 기반 메트릭 (포트 9965, Cilium agent 파드에서 노출)
      metrics:
        port: 9965
        enableOpenMetrics: true
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - icmp
          - http
          - port-distribution