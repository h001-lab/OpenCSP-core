---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencsp-console
  namespace: opencsp-console
spec:
  interval: 1h
  chart:
    spec:
      chart: opencsp-console
      version: "0.1.9"
      sourceRef:
        kind: HelmRepository
        name: opencsp-console
        namespace: flux-system
  values:
    be:
      image:
        tag: "0.1.9"
      env:
        APP_IAM_PROVIDER: "none"
        APP_K8S_ENABLED: "true"
      existingSecret: "opencsp-be-secret"

    fe:
      image:
        tag: "0.1.9"
      env:
        NEXTAUTH_URL: "https://opencsp.avgmax.team"
      existingSecret: "opencsp-fe-secret"

    ingress:
      enabled: true
      className: "cilium"
      annotations:
        cert-manager.io/cluster-issuer: "selfsigned-issuer"
        ingress.cilium.io/backend-protocol: "http"
      tls:
        - hosts:
            - opencsp.avgmax.team
          secretName: opencsp-console-tls
      hosts:
        - host: opencsp.avgmax.team
          paths:
            # 1. 웹소켓 전용 라우팅: /api/console/ws 경로는 BFF(Next.js)를 거치지 않고 백엔드로 직접 연결
            # Ingress는 더 구체적인 경로(Longest Prefix Match)를 우선하므로 웹소켓 요청만 백엔드로 직접 흐르게 됩니다.
            - path: /api/console/ws
              pathType: Prefix
              backend:
                service:
                  name: opencsp-console-be
                  port:
                    number: 8080

            # 2. 나머지 라우팅 (BFF 및 정적 파일): /api/auth 등 일반 BFF 요청을 포함한 모든 트래픽은 FE로 전달
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: opencsp-console-fe
                  port:
                    number: 3000

  # tbot 사이드카를 be Deployment에 주입
  # Helm 차트가 extraContainers를 지원하지 않으므로 postRenderers로 직접 패치
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: opencsp-console-be
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: opencsp-console-be
              spec:
                template:
                  spec:
                    serviceAccountName: opencsp-tbot
                    volumes:
                      - name: tbot-identity
                        emptyDir: {}
                      - name: tbot-config
                        configMap:
                          name: tbot-config
                    initContainers:
                      # K8s 1.29+ native sidecar: restartPolicy: Always 로 파드 라이프사이클 동안 실행
                      # 인증서 만료 전 자동 갱신 담당
                      - name: tbot
                        image: public.ecr.aws/gravitational/tbot:18.6.4
                        restartPolicy: Always
                        args:
                          - start
                          - --config=/etc/tbot/tbot.yaml
                        volumeMounts:
                          - name: tbot-identity
                            mountPath: /var/tbot/identity
                          - name: tbot-config
                            mountPath: /etc/tbot
                            readOnly: true
                        securityContext:
                          runAsNonRoot: true
                          runAsUser: 65534
                          allowPrivilegeEscalation: false
                          readOnlyRootFilesystem: true
                        resources:
                          requests:
                            cpu: 10m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
                    containers:
                      # be 컨테이너에 tbot-identity 볼륨 마운트 추가
                      - name: opencsp-console-be
                        volumeMounts:
                          - name: tbot-identity
                            mountPath: /var/tbot/identity
                            readOnly: true
