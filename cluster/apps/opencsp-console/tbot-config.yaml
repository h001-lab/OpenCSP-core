apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencsp-tbot
  namespace: opencsp-console
---
# tbot이 Kubernetes join method로 Teleport에 인증할 때
# Teleport auth server가 SA 토큰을 검증하기 위해 TokenReview를 호출함.
# Teleport는 자체 ClusterRole로 이미 권한을 보유하므로 이 SA는 별도 RBAC 불필요.
# tbot 자체는 projected SA 토큰(/var/run/secrets/kubernetes.io/serviceaccount/token)만 읽으면 됨.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tbot-config
  namespace: opencsp-console
data:
  tbot.yaml: |
    version: v2
    proxy_server: teleport.avgmax.team:443
    onboarding:
      join_method: kubernetes
      # Teleport ProvisionToken 리소스 이름 (값이 아닌 이름 참조)
      token: opencsp-be-bot
    storage:
      type: memory
    outputs:
      # be 컨테이너가 읽을 bot identity (TLS 인증서 + 키)
      - type: identity
        destination:
          type: directory
          path: /var/tbot/identity
